<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--ink:#0e2a38;--ink2:#16384a;--gold:#f9c614;--sky:#dceef9;--paper:#f7f5ef;--text:#1b2a33;--mute:#5d6d77}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,sans-serif;background:var(--paper);color:var(--text);line-height:1.7}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--ink);position:sticky;top:0;z-index:20}
.bar{max-width:1100px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar img{height:54px;display:block}
nav{display:flex;gap:18px;font-weight:500}
nav a{color:var(--sky);text-decoration:none}
nav a:hover{color:var(--gold)}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;background:var(--gold);color:var(--ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--sky);border:1.5px solid var(--sky)}
.btn.sm{padding:5px 12px;font-size:.9rem}
.btn.red{background:#b3261e;color:#fff}
.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:48px 20px 72px;text-align:center;border-bottom:8px solid var(--gold);min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0e2a38cc,#0e2a38aa 50%,#0e2a38ee);z-index:1}
.hero>*:not(video){position:relative;z-index:2}
.hero .hero-logo{width:min(220px,55vw);height:auto;margin:0 auto 12px;display:block}
.foot-logo{height:70px;display:block;margin:0 auto 10px}
@media(prefers-reduced-motion:reduce){.hero video{display:none}.hero{background:var(--ink) url(hero-poster.jpg) center/cover}}
.hero h1{font-family:'Reem Kufi',serif;font-size:clamp(2rem,6vw,3.6rem);margin:0 0 10px;line-height:1.3}
.hero p{max-width:560px;margin:0 auto 24px;color:var(--sky);font-size:1.1rem}
main{max-width:1100px;margin:auto;padding:20px}
section{padding:36px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-family:'Reem Kufi',serif;font-size:2rem;margin:0;color:var(--ink)}
.sec-head a{font-weight:700;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e3e0d5;display:flex;flex-direction:column}
.card .ph{aspect-ratio:16/10;background:var(--sky) center/cover}
.card .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:1.2rem;color:var(--ink)}
.card .dt{color:var(--mute);font-size:.95rem;white-space:pre-line}
.price{font-family:'Reem Kufi',serif;font-size:1.5rem;color:var(--ink);margin-top:auto}
.price b{background:var(--gold);padding:0 8px;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.empty{color:var(--mute);padding:20px;border:2px dashed #cfcab8;border-radius:12px;text-align:center}
footer{background:var(--ink);color:var(--sky);text-align:center;padding:24px;margin-top:40px}
dialog{border:0;border-radius:14px;padding:24px;width:min(440px,92vw);font-family:inherit}
dialog::backdrop{background:#0e2a38aa}
dialog h3{margin:0 0 14px;font-family:'Reem Kufi',serif;font-size:1.5rem}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1.5px solid #b9c4cb;border-radius:8px}
.msg{color:#b3261e;min-height:1.4em;margin-top:8px}
.admin-bar{background:var(--gold);color:var(--ink);padding:8px 20px;display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
@media(max-width:640px){nav{display:none}}
</style>
</head>

<main id="sections"></main>

<dialog id="loginDlg">

  try{
    const r = await fetch(API_URL + "?action=list");
    const d = await r.json();
    offers = d.offers || [];
  }catch(e){ offers = SEED; }
  render();
}

function render(){
  $("nav").innerHTML = SECTIONS.map(s => `<a href="#${s.id}">${s.name}</a>`).join("");
  $("sections").innerHTML = SECTIONS.map(s => {
    const list = offers.filter(o => o.section === s.id);
    const cards = list.map(o => {
      
      return `<article class="card">
        <div class="ph" ${o.image ? `style="background-image:url('${esc(o.image)}')"` : ""}></div>
        <div class="bd"><h3>${esc(o.title)}</h3><div class="dt">${esc(o.details)}</div>
        ${o.price ? `<div class="price"><b>${esc(o.price)}</b></div>` : ""}
        <div class="row"><button class="btn sm" data-sub="${esc(o.id)}">اشترك في العرض</button>
        ${isAdmin() ? `<button class="btn sm ghost" style="color:var(--ink);border-color:var(--ink)" data-edit="${esc(o.id)}">تعديل</button><button class="btn sm red" data-del="${esc(o.id)}">حذف</button>` : ""}</div></div>
      </article>`;
    }).join("");
    return `<section id="${s.id}"><div class="sec-head"><h2>${s.name}</h2></div>
      ${cards ? `<div class="grid">${cards}</div>` : `<div class="empty">لا توجد عروض منشورة هنا حاليًا. تابعنا قريبًا لمشاهدة آخر العروض.</div>`}</section>`;
  }).join("");
  $("loginBtn").style.display = session ? "none" : "";
  $("logoutBtn").style.display = session ? "" : "none";
  $("who").textContent = session ? "أهلًا، " + session.name : "";
  $("adminBar").style.display = isAdmin() ? "flex" : "none";
}

/* تسجيل الدخول والتسجيل */
function setMode(m){
  mode = m;
  $("authTitle").textContent = m === "login" ? "تسجيل الدخول" : "إنشاء حساب جديد";
  $("regOnly").style.display = m === "login" ? "none" : "block";
  $("doAuth").textContent = m === "login" ? "دخول" : "إنشاء الحساب";
  $("switchMode").textContent = m === "login" ? "ليس لديك حساب؟ أنشئ حساب جديد" : "لديك حساب؟ سجّل الدخول";
  $("loginMsg").textContent = "";
}
function openAuth(m){ setMode(m || "login"); $("loginDlg").showModal(); }
$("loginBtn").onclick = () => openAuth("login");
$("switchMode").onclick = e => { e.preventDefault(); setMode(mode === "login" ? "register" : "login"); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());
const AUTH_ERR = {credentials:"البريد أو كلمة المرور غير صحيحة.", exists:"هذا البريد مسجل بالفعل. سجّل الدخول.", invalid:"راجع البيانات: اسم، بريد صحيح، كلمة مرور 6 أحرف على الأقل، والموافقة على استخدام البيانات.", locked:"محاولات خاطئة كثيرة. حاول مرة أخرى بعد 15 دقيقة."};
$("doAuth").onclick = async () => {
  $("loginMsg").textContent = "جارٍ التحقق...";
  try{
    const body = {action:mode, email:$("u").value.trim(), pass:$("p").value};
    if(mode === "register"){
      body.name = $("r_name").value.trim(); body.phone = $("r_phone").value.trim(); body.consent = $("r_consent").checked;
      if(!body.consent){ $("loginMsg").textContent = AUTH_ERR.invalid; return; }
    }
    const d = await api(body);
    if(d.ok){
      session = {token:d.token, role:d.role, name:d.name};
      sessionStorage.setItem("hamsa_session", JSON.stringify(session));
      $("loginDlg").close(); $("p").value = ""; render();
      if(pendingSub){ const id = pendingSub; pendingSub = null; subscribe(id); }
    } else $("loginMsg").textContent = AUTH_ERR[d.error] || "تعذر تنفيذ الطلب.";
  }catch(e){ $("loginMsg").textContent = "تعذر الاتصال بالسيرفر. راجع رابط Apps Script."; }
};
function logout(){ session = null; sessionStorage.removeItem("hamsa_session"); render(); }
$("logoutBtn").onclick = logout;

/* الاشتراك في عرض */
let pendingSub = null;
async function subscribe(id){
  const o = offers.find(x => String(x.id) === String(id));
  if(!confirm("تأكيد الاشتراك في: " + (o ? o.title : "") + "؟ سيتواصل معك فريق همسة.")) return;
  const d = await api({action:"subscribe", token:token(), offerId:id});
  if(d.ok) alert("تم استلام طلبك. سنتواصل معك قريبًا.");
  else if(d.error === "auth"){ logout(); pendingSub = id; openAuth("login"); }
  else alert("تعذر إرسال الطلب، حاول مرة أخرى.");
}

/* طلبات الاشتراك للمدير */
const STATUSES = ["جديد","تم التواصل","تم الحجز","ملغي"];
$("subsBtn").onclick = async () => {
  const d = await api({action:"subs", token:token()});
  if(!d.ok){ if(d.error === "auth") logout(); return; }
  const th = "padding:8px;border-bottom:1px solid #ddd;text-align:right";
  $("subsTable").innerHTML = `<tr>${["التاريخ","العرض","الاسم","الموبايل","البريد","الحالة"].map(h => `<th style="${th}">${h}</th>`).join("")}</tr>` +
    (d.subs.length ? d.subs.map(r => `<tr>${[new Date(r.time).toLocaleString("ar-EG"), r.offerTitle, r.name, r.phone, r.email].map(v => `<td style="${th}">${esc(v)}</td>`).join("")}
      <td style="${th}"><select data-row="${r.row}" data-email="${esc(r.email)}" style="padding:4px">${STATUSES.map(st => `<option ${st === r.status ? "selected" : ""}>${st}</option>`).join("")}</select></td></tr>`).join("")
      : `<tr><td style="${th}" colspan="6">لا توجد طلبات بعد.</td></tr>`);
  $("subsDlg").showModal();
};
$("subsTable").addEventListener("change", async e => {
  const sel = e.target; if(!sel.dataset.row) return;
  sel.disabled = true;
  const d = await api({action:"setStatus", token:token(), row:sel.dataset.row, email:sel.dataset.email, status:sel.value});
  sel.disabled = false;
  if(!d.ok){ alert("تعذر تحديث الحالة. أغلق النافذة وافتحها من جديد."); if(d.error === "auth") logout(); }
});

/* إضافة وتعديل */
$("f_section").innerHTML = SECTIONS.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
function openOffer(o){
  editingId = o ? o.id : null;
  $("offerTitle").textContent = o ? "تعديل العرض" : "عرض جديد";
  $("f_section").value = o?.section || SECTIONS[0].id;
  $("f_title").value = o?.title || ""; $("f_price").value = o?.price || "";
  $("f_details").value = o?.details || ""; $("f_image").value = o?.image || "";
  $("offerMsg").textContent = ""; $("offerDlg").showModal();
}
$("addBtn").onclick = () => openOffer(null);
$("saveOffer").onclick = async () => {
  const offer = {id:editingId, section:$("f_section").value, title:$("f_title").value.trim(), price:$("f_price").value.trim(),
    details:$("f_details").value.trim(), image:$("f_image").value.trim(), link:""};
  if(!offer.title){ $("offerMsg").textContent = "اكتب اسم العرض."; return; }
  $("offerMsg").textContent = "جارٍ الحفظ...";
  const d = await api({action:"save", token:token(), offer});
  if(d.ok){ $("offerDlg").close(); load(); }
  else { $("offerMsg").textContent = d.error === "auth" ? "انتهت الجلسة، سجّل الدخول مرة أخرى." : "تعذر الحفظ."; if(d.error==="auth") logout(); }
};
$("sections").addEventListener("click", async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del, sub = e.target.dataset.sub;
  if(sub){ if(session) subscribe(sub); else { pendingSub = sub; openAuth("login"); } return; }
  if(ed) openOffer(offers.find(o => String(o.id) === ed));
  if(del && confirm("هل تريد حذف هذا العرض؟")){
    const d = await api({action:"delete", token:token(), id:del});
    if(d.ok) load(); else if(d.error==="auth") logout();
  }
});

render();
if(API_URL.startsWith("http")) load();
</script>
</body>
</html>
